name: Keep server-fixes on main

# server-fixes is main plus the server-side fixes ported from the Live build. Whenever main moves, the
# fixes are replayed on top of the new main (a rebase) so the branch always stays true to main. A daily
# run and a manual "Run workflow" button catch anything the push trigger missed.
#
# If a fix no longer applies cleanly, the run fails (GitHub emails the repo owner), lists the conflicting
# files and leaves server-fixes untouched. Rebase it by hand then:
#   git fetch potato && git rebase potato/main   (fix the conflicts)
#   git push --force-with-lease potato server-fixes

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebase-server-fixes
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: server-fixes
          fetch-depth: 0

      - name: Rebase server-fixes onto main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          main=$(git rev-parse --short origin/main)
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "server-fixes already sits on main ($main); nothing to do."
            exit 0
          fi

          before=$(git rev-parse HEAD)
          if ! git rebase origin/main; then
            echo "::error::server-fixes no longer rebases cleanly onto main ($main). Conflicting files:"
            git diff --name-only --diff-filter=U | sed 's/^/  /'
            git rebase --abort
            exit 1
          fi

          git push --force-with-lease=server-fixes:"$before" origin HEAD:server-fixes
          echo "server-fixes rebased onto main ($main) and pushed."
